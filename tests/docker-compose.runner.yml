services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_URL: ${APP_URL:-http://localhost:8009}
      DATABASE_URL: ${DATABASE_URL}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      FORCE_COLOR: "1"
      TERM: xterm-256color
    network_mode: host
    # Lancer tous les tests (couleurs + exit automatique) :
    #   docker compose -f docker-compose.runner.yml --env-file .env.runner run --rm -T tests
    #
    # Sous-ensemble :
    #   docker compose -f docker-compose.runner.yml --env-file .env.runner run --rm -T tests pytest api/ -v
    #   docker compose -f docker-compose.runner.yml --env-file .env.runner run --rm -T tests pytest ui/ -v
